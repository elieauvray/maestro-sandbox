<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>TicTacToe</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="site-header">
    <h1>TicTacToe</h1>
  </header>

  <main class="game">
    <p id="status" class="status" aria-live="polite">X to play</p>

    <div id="board" class="board">
      <button type="button" class="cell" aria-label="Row 1, column 1, empty"></button>
      <button type="button" class="cell" aria-label="Row 1, column 2, empty"></button>
      <button type="button" class="cell" aria-label="Row 1, column 3, empty"></button>
      <button type="button" class="cell" aria-label="Row 2, column 1, empty"></button>
      <button type="button" class="cell" aria-label="Row 2, column 2, empty"></button>
      <button type="button" class="cell" aria-label="Row 2, column 3, empty"></button>
      <button type="button" class="cell" aria-label="Row 3, column 1, empty"></button>
      <button type="button" class="cell" aria-label="Row 3, column 2, empty"></button>
      <button type="button" class="cell" aria-label="Row 3, column 3, empty"></button>
    </div>

    <div class="controls">
      <button type="button" id="restart" class="button">Restart</button>
    </div>
  </main>

  <footer class="site-footer">
    <p>Built for Upsun. Two players, one device.</p>
  </footer>
</body>
</html>
